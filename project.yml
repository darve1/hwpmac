name: HwpMac
options:
  bundleIdPrefix: local.hwpmac
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  Rhwp:
    path: third_party/rhwp/bindings/swift

settings:
  base:
    SWIFT_VERSION: "6.0"
    # rhwp FFI dylib staged by scripts/build-native.sh. The app embeds it in
    # Contents/Frameworks; its extensions and the test bundle use that copy.
    LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/build/native/lib
    # The staged rhwp library is built for Apple silicon only.
    ARCHS: arm64
    # Ad-hoc signing for local builds. The hardened runtime stays off here:
    # it rejects the separately signed rhwp dylib when nothing carries a team
    # ID. Distribution builds sign with a Developer ID (same team for app,
    # extensions and dylib) and turn it on for notarization; see README.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO

# Quick Look and Spotlight extensions: sandboxed, sharing the app's
# embedded rhwp dylib.
targetTemplates:
  EngineExtension:
    type: app-extension
    platform: macOS
    sources:
      - App/Sources/Engine
    dependencies:
      - package: Rhwp
        product: Rhwp
    entitlements:
      path: Extensions/${target_name}/${target_name}.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../../../../Frameworks"

  CommandLineTool:
    type: tool
    platform: macOS
    sources:
      - App/Sources/Engine
    dependencies:
      - package: Rhwp
        product: Rhwp
    settings:
      base:
        LD_RUNPATH_SEARCH_PATHS: $(PROJECT_DIR)/build/native/lib
    scheme: {}

targets:
  HwpMac:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - path: App/Resources
        buildPhase: resources
    dependencies:
      - package: Rhwp
        product: Rhwp
      - framework: build/native/lib/librhwp_native_ffi.dylib
        embed: true
        codeSign: true
      - target: QuickLookPreview
      - target: QuickLookThumbnail
      - target: SpotlightImporter
      - target: EngineService
    entitlements:
      path: App/HwpMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: HwpMac
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: 본 제품은 한글과컴퓨터의 한글 문서 파일(.hwp) 공개 문서를 참고하여 개발하였습니다.
        CFBundleDocumentTypes:
          - CFBundleTypeName: HWP 문서
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            NSDocumentClass: $(PRODUCT_MODULE_NAME).HwpDocument
            LSItemContentTypes:
              - com.hancom.hwp
              - com.haansoft.hancomofficeviewer.mac.hwp
          - CFBundleTypeName: HWPX 문서
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            NSDocumentClass: $(PRODUCT_MODULE_NAME).HwpDocument
            LSItemContentTypes:
              - com.hancom.hwpx
              - com.haansoft.hancomofficeviewer.mac.hwpx
        # Imported, not exported: Hancom owns these formats. The identifiers
        # follow other HWP apps (e.g. HOP); Hancom's own UTI is unverified.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.hancom.hwp
            UTTypeDescription: HWP 문서
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [hwp]
              public.mime-type: [application/x-hwp]
          - UTTypeIdentifier: com.hancom.hwpx
            UTTypeDescription: HWPX 문서
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [hwpx]
              public.mime-type: [application/vnd.hancom.hwpx]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.hwpmac.HwpMac
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
    scheme:
      testTargets:
        - HwpMacTests

  QuickLookPreview:
    templates: [EngineExtension]
    sources:
      - Extensions/QuickLookPreview
    info:
      path: Extensions/QuickLookPreview/Info.plist
      properties:
        CFBundleDisplayName: HwpMac 미리보기
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewProvider
          NSExtensionAttributes:
            QLIsDataBasedPreview: true
            QLSupportsSearchableItems: false
            QLSupportedContentTypes: &quickLookTypes
              - com.hancom.hwp
              - com.hancom.hwpx
              - com.haansoft.hancomofficeviewer.mac.hwp
              - com.haansoft.hancomofficeviewer.mac.hwpx
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.hwpmac.HwpMac.QuickLookPreview

  QuickLookThumbnail:
    templates: [EngineExtension]
    sources:
      - Extensions/QuickLookThumbnail
    info:
      path: Extensions/QuickLookThumbnail/Info.plist
      properties:
        CFBundleDisplayName: HwpMac 썸네일
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
          NSExtensionAttributes:
            QLThumbnailMinimumDimension: 0
            QLSupportedContentTypes: *quickLookTypes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.hwpmac.HwpMac.QuickLookThumbnail

  SpotlightImporter:
    templates: [EngineExtension]
    sources:
      - Extensions/SpotlightImporter
    info:
      path: Extensions/SpotlightImporter/Info.plist
      properties:
        CFBundleDisplayName: HwpMac Spotlight
        NSExtension:
          NSExtensionPointIdentifier: com.apple.spotlight.import
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SpotlightImporter
          NSExtensionAttributes:
            CSSupportedContentTypes: *quickLookTypes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.hwpmac.HwpMac.SpotlightImporter

  # Parses and edits documents in a sandbox with no file access; the app
  # sends document bytes over XPC (App/Sources/Engine/EngineXPC.swift).
  EngineService:
    type: xpc-service
    platform: macOS
    sources:
      - App/Sources/Engine
      - Services/EngineService
    dependencies:
      - package: Rhwp
        product: Rhwp
    entitlements:
      path: Services/EngineService/EngineService.entitlements
      properties:
        com.apple.security.app-sandbox: true
    info:
      path: Services/EngineService/Info.plist
      properties:
        CFBundleDisplayName: HwpMac Engine
        XPCService:
          ServiceType: Application
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.hwpmac.HwpMac.EngineService
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../../../../Frameworks"

  # Hosted in the app, so it uses the app's copy of the rhwp library.
  HwpMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/HwpMacTests
    dependencies:
      - target: HwpMac
    settings:
      base:
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/HwpMac.app/Contents/MacOS/HwpMac
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES

  hwpmac-render-snapshot:
    templates: [CommandLineTool]
    sources:
      - Tools/RenderSnapshot

  hwpmac-latency:
    templates: [CommandLineTool]
    sources:
      - Tools/Latency

  hwpmac-edit-check:
    templates: [CommandLineTool]
    sources:
      - Tools/EditCheck
